syntax = "proto3";

package gutenrip.worker;

message Empty {}

message Capabilities {
  string worker_name = 1;
  uint32 protocol_version = 2;
  bool print_engine_ready = 3;
}

message PrintOption {
  string value = 1;
  string label = 2;
}

message DriverResolution {
  string name = 1;
  string label = 2;
  int32 physical_dpi_x = 3;
  int32 physical_dpi_y = 4;
  int32 printed_dpi_x = 5;
  int32 printed_dpi_y = 6;
  int32 base_dpi_x = 7;
  repeated PrintOption dither_options = 8;
  repeated PrintOption weave_options = 9;
  bool feather_supported = 10;
  repeated PrintOption input_slot_options = 11;
  repeated PrintOption printing_direction_options = 12;
}

message PhysicalChannelProfile {
  int32 index = 1;
  int32 esc_color = 2;
  int32 physical_head_offset = 3;
}

message PrintDriverProfile {
  string printer_label = 1;
  string driver = 2;
  reserved 3;
  reserved "model_id";
  repeated DriverResolution resolutions = 4;
  int32 nozzles = 5;
  int32 nozzle_separation = 6;
  int32 base_separation = 7;
  int32 channel_count = 8;
  repeated PhysicalChannelProfile physical_channels = 9;
}

message PrintDriverCatalogRequest {
  repeated string driver_ids = 1;
}

message PrintDriverCatalog {
  repeated PrintDriverProfile drivers = 1;
  repeated string warnings = 2;
  uint32 protocol_version = 3;
}

message PageGeometryPoints {
  double page_width = 1;
  double page_height = 2;
  double left = 3;
  double top = 4;
  double print_width = 5;
  double print_height = 6;
}

message RawImageShape {
  int32 width = 1;
  int32 height = 2;
  int32 channels = 3;
}

message RawChannelRuntime {
  int32 index = 1;
  double density = 2;
  optional int32 head_offset = 3;
  optional int32 correction_rows = 4;
}

message PrintEngineSettings {
  reserved 19;
  reserved "ink_limit";
  string page_size = 1;
  string input_slot = 2;
  string duplex = 3;
  string cd_inner_radius = 4;
  string media_type = 5;
  string resolution = 6;
  string quality = 7;
  string printing_mode = 8;
  string input_image_type = 9;
  string ink_set = 10;
  string ink_type = 11;
  string color_correction = 12;
  string dither_algorithm = 13;
  string channel_bit_depth = 14;
  string printing_direction = 15;
  string weave = 16;
  int32 band_enhancement = 17;
  double density = 18;
  double esc_i_feather_edge = 20;
  double brightness = 21;
  double contrast = 22;
  double saturation = 23;
  double gamma = 24;
  optional int32 active_nozzles = 25;
  repeated RawChannelRuntime raw_channels = 26;
}

message RenderPlaneStreamStart {
  string job_id = 1;
  string printer_driver = 2;
  PageGeometryPoints geometry = 3;
  RawImageShape image = 4;
  PrintEngineSettings settings = 5;
}

message RawRow {
  int32 row = 1;
  bytes data = 2;
}

message RawRowRequest {
  int32 row = 1;
  uint64 byte_limit = 2;  // max 64 MiB per row; enforced server-side
}

message RawPrnChunk {
  bytes data = 1;
  uint64 raw_prn_bytes_written = 2;
}

message RenderPlaneStreamDone {
  bool ok = 1;
  string message = 2;
  uint64 raw_prn_bytes_written = 3;
}

message RenderPlaneStreamRequest {
  oneof payload {
    RenderPlaneStreamStart start = 1;
    RawRow raw_row = 2;
  }
}

message RenderPlaneStreamResponse {
  oneof payload {
    RawRowRequest raw_row_request = 1;
    RawPrnChunk raw_prn_chunk = 2;
    RenderPlaneStreamDone done = 3;
  }
}

message WorkerHelloRequest {
  bytes client_nonce = 1;        // client 随机 nonce，<= 64 字节
  uint32 protocol_version = 2;
}

message WorkerHelloResponse {
  bytes worker_public_key = 1;   // raw 32 bytes
  bytes signature = 2;           // Ed25519(client_nonce || le32(protocol_version) || endpoint)
  string worker_name = 3;
  uint32 protocol_version = 4;
}

service RipWorker {
  rpc GetCapabilities(Empty) returns (Capabilities);
  rpc GetPrintDriverCatalog(PrintDriverCatalogRequest) returns (PrintDriverCatalog);
  rpc RenderPlaneStream(stream RenderPlaneStreamRequest) returns (stream RenderPlaneStreamResponse);
  rpc WorkerHello(WorkerHelloRequest) returns (WorkerHelloResponse);
}
