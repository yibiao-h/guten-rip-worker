syntax = "proto3";

package gutenrip.worker;

message Empty {}

enum Plane {
  PLANE_UNSPECIFIED = 0;
  PLANE_COLOR = 1;
  PLANE_WHITE = 2;
}

enum NozzleHalf {
  HALF_UNSPECIFIED = 0;
  HALF_BASE0 = 1;
  HALF_OFFSET90 = 2;
}

message RenderPlaneRequest {
  string job_id = 1;
  Plane plane = 2;
  NozzleHalf half = 3;
  string input_path = 4;
  string output_path = 5;
  string printer_driver = 6;
  string ink_name = 7;
  int32 page_width_points = 8;
  int32 page_height_points = 9;
  int32 dpi_x = 10;
  int32 dpi_y = 11;
  double density = 12;
  double page_width_mm = 13;
  double page_height_mm = 14;
  double image_x_mm = 15;
  double image_y_mm = 16;
  double image_width_mm = 17;
  double image_height_mm = 18;
  map<string, string> print_settings = 19;
}

message RenderPlaneResult {
  bool ok = 1;
  string message = 2;
  string output_path = 3;
  uint64 bytes_written = 4;
}

message ComposeSettings {
  string layer_order = 1;
  bool front_half_prints_first = 2;
  int32 source_light_cyan_white_color = 3;
  int32 source_light_magenta_white_color = 4;
  int32 light_cyan_white_color = 5;
  int32 light_magenta_white_color = 6;
  int32 nozzles = 7;
  int32 nozzle_separation = 8;
  int32 base_separation = 9;
  repeated int32 base_channel_colors = 10;
}

message RenderPlaneStreamStart {
  string job_id = 1;
  Plane plane = 2;
  NozzleHalf half = 3;
  string printer_driver = 4;
  string ink_name = 5;
  int32 page_width_points = 6;
  int32 page_height_points = 7;
  int32 dpi_x = 8;
  int32 dpi_y = 9;
  double density = 10;
  double page_width_mm = 11;
  double page_height_mm = 12;
  double image_x_mm = 13;
  double image_y_mm = 14;
  double image_width_mm = 15;
  double image_height_mm = 16;
  map<string, string> print_settings = 17;
  int32 image_width_px = 18;
  int32 image_height_px = 19;
  int32 raw_channels = 20;
  ComposeSettings compose = 21;
}

message RawRow {
  int32 row = 1;
  bytes data = 2;
}

message RawRowRequest {
  int32 row = 1;
  uint64 byte_limit = 2;
}

message PrnChunk {
  bytes data = 1;
  uint64 bytes_written = 2;
}

message RenderPlaneStreamDone {
  bool ok = 1;
  string message = 2;
  uint64 bytes_written = 3;
}

message RenderPlaneStreamRequest {
  oneof payload {
    RenderPlaneStreamStart start = 1;
    RawRow raw_row = 2;
    CancelJobRequest cancel = 3;
  }
}

message RenderPlaneStreamResponse {
  oneof payload {
    RawRowRequest raw_row_request = 1;
    PrnChunk prn_chunk = 2;
    RenderPlaneStreamDone done = 3;
  }
}

message Capability {
  string key = 1;
  repeated string values = 2;
}

message Capabilities {
  string worker_name = 1;
  string default_printer_driver = 2;
  repeated Capability capabilities = 3;
}

message DriverResolution {
  string name = 1;
  string label = 2;
  int32 physical_dpi_x = 3;
  int32 physical_dpi_y = 4;
  int32 printed_dpi_x = 5;
  int32 printed_dpi_y = 6;
}

message PrintDriverProfile {
  string printer_model = 1;
  string printer_label = 2;
  string driver = 3;
  int32 model_id = 4;
  repeated DriverResolution resolutions = 5;
  int32 nozzles = 6;
  int32 nozzle_separation = 7;
  int32 base_separation = 8;
  int32 base_padding_lines = 9;
  int32 primary_white_esc_color = 10;
  int32 secondary_white_esc_color = 11;
  repeated int32 color_offset_base_esc_colors = 12;
  repeated int32 white_offset_base_esc_colors = 13;
}

message PrintDriverCatalog {
  repeated PrintDriverProfile drivers = 1;
  repeated string warnings = 2;
}

message CancelJobRequest {
  string job_id = 1;
}

message CancelJobResult {
  bool ok = 1;
  string message = 2;
}

service RipWorker {
  rpc GetCapabilities(Empty) returns (Capabilities);
  rpc GetPrintDriverCatalog(Empty) returns (PrintDriverCatalog);
  rpc RenderPlane(RenderPlaneRequest) returns (RenderPlaneResult);
  rpc RenderPlaneStream(stream RenderPlaneStreamRequest) returns (stream RenderPlaneStreamResponse);
  rpc CancelJob(CancelJobRequest) returns (CancelJobResult);
}
